name: Daily static publish
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
jobs:
  trigger-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Missing CLOUDFLARE_PAGES_DEPLOY_HOOK repository secret" >&2
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL"
